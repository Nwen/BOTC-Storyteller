services:
  botc-storyteller:
    build: .
    ports:
      - "32768:80"
    restart: unless-stopped
    volumes:
      # Script .json files dropped in this host folder show up in the app on next load.
      # Set SCRIPTS_DIR (in .env, the shell, or Portainer's stack environment variables)
      # to an absolute host path; defaults to ./scripts next to this file.
      - ${SCRIPTS_DIR:-./scripts}:/data/scripts:ro
