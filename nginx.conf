server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Saved scripts shared between devices (see src/lib/scriptSync.ts).
    # ^~ keeps the .json caching rule below from matching these files.
    location ^~ /api/scripts/ {
        alias /data/scripts/;
        dav_methods PUT DELETE;
        create_full_put_path on;
        client_max_body_size 5m;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-store";
    }

    # Cache static assets aggressively; index.html never cached
    location ~* \.(js|css|png|svg|ico|woff2|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
